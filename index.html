<body>
<div id="app">
  <div id="stage">
    <div id="bg" class="bgl"></div>
    <div id="bg2" class="bgl"></div>
    <div id="shade"></div>
    <div id="prop"></div>
    <div id="hud">
      <div class="place"></div>
      <div class="tools">
        <span class="cash" title="Money in hand"></span>
        <button data-tool="carnet" title="Her notebook (C)">Carnet</button>
        <button data-tool="roll" title="The watch roll (R)">Roll</button>
        <button data-tool="lineage" title="The lineage board (L)">Lineage</button>
        <button class="snd" title="Sound on / off" aria-label="Sound"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path class="wave" d="M12.5 6.5a5 5 0 0 1 0 7M14.6 4.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="mute" d="M12.5 7.5l5 5M17.5 7.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="menu" title="Menu (Esc)" aria-label="Menu"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div id="talk"><div id="dlg"></div><div id="choices"></div></div>
  </div>
  <div id="panel"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
